name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The floor and ceiling of `requires-python` both get exercised: the
    # classifiers promise 3.9 through 3.13, so all of them run.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pandas is included so the optional extra is installed and importable
      # on every version we claim to support.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,pandas]"

      - name: Tests
        run: python -m pytest

  lint:
    # Version-independent, so it runs once rather than across the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,pandas]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src/xcreener
